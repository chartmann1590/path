name: Direct download build + emulator test
# Direct-download build of this app (GitHub Releases / charleshartmann.com): same code, built with store=direct
# (no Google Play links, no Play in-app review prompt, nothing sold through Google Play). Emulator with Google APIs (a normal phone).
# Branch builds only make a DRAFT release; nothing is uploaded to any store.
on:
  push:
    branches: [direct-stripe]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: direct-${{ github.ref }}
  cancel-in-progress: true
jobs:
  direct:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ADMOB_APPLICATION_ID: ${{ secrets.ADMOB_APPLICATION_ID }}
      ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
      ADMOB_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_AD_UNIT_ID }}
      ADMOB_REWARDED_AD_UNIT_ID: ${{ secrets.ADMOB_REWARDED_AD_UNIT_ID }}
      RELEASE_STORE_FILE: keystore/release.keystore
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Validate required secrets
      shell: bash
      run: "missing=()\nfor name in \\\n  ADMOB_APPLICATION_ID \\\n  ADMOB_BANNER_AD_UNIT_ID \\\n  ADMOB_INTERSTITIAL_AD_UNIT_ID \\\n  ADMOB_REWARDED_AD_UNIT_ID \\\n  RELEASE_STORE_PASSWORD \\\n  RELEASE_KEY_ALIAS \\\n  RELEASE_KEY_PASSWORD \\\n  GOOGLE_SERVICES_JSON \\\n  RELEASE_KEYSTORE_BASE64\ndo\n  if [ -z \"${!name}\" ]; then\n    missing+=(\"$name\")\n  fi\ndone\n\nif [ \"${#missing[@]}\" -gt 0 ]; then\n  printf 'Missing required GitHub secrets:\\n'\n  printf ' - %s\\n' \"${missing[@]}\"\n  exit 1\nfi\n"
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: gradle
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - name: Restore release-only files
      shell: bash
      run: 'mkdir -p app keystore

        printf ''%s'' "$GOOGLE_SERVICES_JSON" > app/google-services.json

        printf ''%s'' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > keystore/release.keystore

        chmod +x gradlew

        '
    - name: Build direct APKs (store=direct)
      env:
        APP_VERSION_CODE: ${{ github.run_number }}
      run: 'set -o pipefail

        ./gradlew --no-daemon assembleRelease -Pstore=direct 2>&1 | tee -a /tmp/dsk-build.log

        mkdir -p dsk-apk


        cp "$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -1 || ls app/build/outputs/apk/release/*.apk | head -1)" dsk-apk/Path-direct-release.apk

        ls -la dsk-apk

        BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)

        $BT/apksigner verify --print-certs dsk-apk/Path-direct-release.apk | head -3 || true

        $BT/aapt2 dump badging dsk-apk/Path-direct-release.apk | head -3 || true

        echo "--- Play Store URL strings left in the direct release dex:"; unzip -p dsk-apk/Path-direct-release.apk ''classes*.dex'' | strings | grep -E "play\.google\.com/store|market://" | head || true

        '
    - name: Ship build log tail to the private drop (on failure)
      if: failure()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: 'tail -c 60000 /tmp/dsk-build.log 2>/dev/null | curl -s -m 60 -X PUT -H "X-Key: $DROP_KEY" --data-binary @- "https://hs-apk-drop.charles-h-hartmann1.workers.dev/c/dsklog_${{ github.event.repository.name }}_r${{ github.run_number }}/0" || true

        '
    - name: Enable KVM
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

        '
    - name: Emulator test (Google APIs image, like a normal phone)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        profile: Nexus 7 2013
        target: google_apis
        arch: x86_64
        ram-size: 3072M
        disk-size: 4096M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: bash .github/direct/run-tests.sh
    - name: Upload test results to Tab's private drop
      if: always()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: bash .github/direct/direct-upload.sh /tmp/dsk-out dsk_Path_r${{ github.run_number }}
    - name: Draft release with the direct APK (not published)
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: direct-${{ github.run_number }}
        name: Direct build ${{ github.run_number }} (${{ github.sha }})
        draft: true
        files: dsk-apk/Path-direct-release.apk
