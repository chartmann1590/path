name: Android Release

on:
  push:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ADMOB_APPLICATION_ID: ${{ secrets.ADMOB_APPLICATION_ID }}
      ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
      ADMOB_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_AD_UNIT_ID }}
      ADMOB_REWARDED_AD_UNIT_ID: ${{ secrets.ADMOB_REWARDED_AD_UNIT_ID }}
      RELEASE_STORE_FILE: keystore/release.keystore
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          missing=()
          for name in \
            ADMOB_APPLICATION_ID \
            ADMOB_BANNER_AD_UNIT_ID \
            ADMOB_INTERSTITIAL_AD_UNIT_ID \
            ADMOB_REWARDED_AD_UNIT_ID \
            RELEASE_STORE_PASSWORD \
            RELEASE_KEY_ALIAS \
            RELEASE_KEY_PASSWORD \
            GOOGLE_SERVICES_JSON \
            RELEASE_KEYSTORE_BASE64
          do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub secrets:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore release-only files
        shell: bash
        run: |
          mkdir -p app keystore
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > keystore/release.keystore
          chmod +x gradlew

      - name: Build release APK and app bundle
        run: ./gradlew --no-daemon clean test assembleRelease bundleRelease

      - name: Read release metadata
        shell: bash
        run: |
          set -euo pipefail
          app_name="$(sed -n 's/.*<string name="app_name">\([^<]*\)<\/string>.*/\1/p' app/src/main/res/values/strings.xml | head -n 1)"
          version_name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          version_code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"

          if [ -z "$app_name" ] || [ -z "$version_name" ] || [ -z "$version_code" ]; then
            echo "Unable to read app_name, versionName, or versionCode."
            exit 1
          fi

          file_prefix="$(printf '%s-%s-%s' "$app_name" "$version_name" "$version_code" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g; s/-\+/-/g; s/^-//; s/-$//')"

          {
            echo "APP_NAME=$app_name"
            echo "VERSION_NAME=$version_name"
            echo "VERSION_CODE=$version_code"
            echo "RELEASE_FILE_PREFIX=$file_prefix"
          } >> "$GITHUB_ENV"

      - name: Collect release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/*.apk "release-artifacts/${RELEASE_FILE_PREFIX}-release.apk"
          cp app/build/outputs/bundle/release/*.aab "release-artifacts/${RELEASE_FILE_PREFIX}-release.aab"
          sha256sum release-artifacts/* > "release-artifacts/${RELEASE_FILE_PREFIX}-SHA256SUMS.txt"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_FILE_PREFIX }}-android-release-${{ github.sha }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          tag="${RELEASE_FILE_PREFIX}-${GITHUB_RUN_NUMBER}-${short_sha}"
          title="${APP_NAME} ${VERSION_NAME} (${VERSION_CODE}) release ${short_sha}"

          gh release create "$tag" release-artifacts/* \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes "Automated ${APP_NAME} ${VERSION_NAME} (${VERSION_CODE}) release for commit ${GITHUB_SHA}."

          gh release edit "$tag" --draft=false --latest
